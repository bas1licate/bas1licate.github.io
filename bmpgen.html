<script>// baby
function gen(method) {
  if (method == 'text') {var ok = document.getElementById('textinput').value}
  if (method == 'file') {var ok = document.getElementById('fileinput').files[0]; var fname = ok.name.split(".").slice(0,-1).join(".")}
  const outbytes = genfull(ok)
  const outer = document.getElementById('inoutput')
  outer.href = URL.createObjectURL(new Blob([outbytes],{type:"image/bmp"}))
  outer.download = (fname ?? "johnresult") + ".bmp"
  window.alert("file ready for download.")
}
</script>
